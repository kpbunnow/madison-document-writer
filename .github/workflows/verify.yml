name: Program verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Full gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: America/Chicago
      PYTHONDONTWRITEBYTECODE: '1'
      DW_TEST_WORKERS: '2'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../madison-browsers
    steps:
      - name: Check out the reviewed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc poppler-utils
      - name: Install frozen dependencies and pinned Chromium
        run: |
          npm ci
          python -m pip install --require-hashes -r requirements-dev.txt
          npx playwright install --with-deps chromium
      - name: Run the full gate
        run: python tools/verify_release.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/verification/latest/
            build/test-results/
          retention-days: 14
          if-no-files-found: warn
