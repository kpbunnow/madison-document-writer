name: Program verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Full gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: America/Chicago
      PYTHONDONTWRITEBYTECODE: '1'
      DW_TEST_WORKERS: '2'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../madison-browsers
    steps:
      - name: Check out the reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc poppler-utils
      - name: Install frozen dependencies and pinned Chromium
        run: |
          npm ci
          python -m pip install --require-hashes -r requirements-dev.txt
          npx playwright install --with-deps chromium
      - name: Run the full gate
        run: python tools/verify_release.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/verification/latest/
            build/test-results/
          retention-days: 14
          if-no-files-found: warn
