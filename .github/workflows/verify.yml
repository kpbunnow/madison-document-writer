name: Program verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stages:
    name: ${{ matrix.stage }} checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage: [regression, browser]
    env:
      TZ: America/Chicago
      PYTHONDONTWRITEBYTECODE: '1'
      DW_TEST_WORKERS: '2'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright-browsers
    steps:
      - name: Check out the reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install document tools
        run: |
          # Bound idle mirror connections for this job, including Playwright's later apt invocation.
          sudo tee /etc/apt/apt.conf.d/80-document-writer-ci > /dev/null <<'APT'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          # Use Ubuntu's canonical archive for the same signed repositories; retain all keys, suites and components.
          for task_sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors.txt; do
            if [ -f "$task_sources" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$task_sources"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes pandoc poppler-utils
      - name: Install frozen dependencies
        run: |
          npm ci
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Read the pinned Playwright version
        id: playwright
        run: node -e "console.log('version=' + require('playwright/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned Chromium download
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Chromium and its system dependencies
        run: |
          npx playwright install --with-deps chromium
      - name: Run the complete verification stage
        env:
          GATE_STAGE: ${{ matrix.stage }}
        run: python tools/verify_release.py --stage "$GATE_STAGE"
      - name: Retain complete stage input
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-${{ matrix.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-upload/
          retention-days: 14
          if-no-files-found: error
      - name: Retain failed-stage diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-${{ matrix.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/verification/latest/
            build/test-results/
          retention-days: 14
          if-no-files-found: warn

  full-gate:
    name: Full gate
    needs: stages
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: America/Chicago
      PYTHONDONTWRITEBYTECODE: '1'
      DW_TEST_WORKERS: '2'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright-browsers
    steps:
      - name: Require every verification stage to succeed
        env:
          STAGE_RESULT: ${{ needs.stages.result }}
        run: |
          if [ "$STAGE_RESULT" != "success" ]; then
            echo "A required verification stage failed, was cancelled or was skipped."
            exit 1
          fi
      - name: Check out the reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install frozen build dependencies
        run: |
          npm ci
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Download this run's regression evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: stage-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-inputs/regression
      - name: Download this run's browser evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: stage-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-inputs/browser
      - name: Assemble the full gate from matching complete evidence
        run: python tools/verify_release.py --assemble build/ci-inputs/regression build/ci-inputs/browser
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/verification/latest/
            build/test-results/
          retention-days: 14
          if-no-files-found: warn
